version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      # run these when most of our developers don't work, don't DoS our CI over the day
      time: "22:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    groups:
      eslint:
        patterns:
          - "eslint*"
      esbuild:
        patterns:
          - "esbuild*"
      patternfly:
        patterns:
          - "@patternfly*"
      react:
        patterns:
          - "react*"
      stylelint:
        patterns:
          - "stylelint*"
      types:
        patterns:
          - "@types*"
          - "types*"

    ignore:
      # https://github.com/cockpit-project/cockpit/issues/21151
      - dependency-name: "sass"
        versions: [">=1.80.0", "2.x"]

      # PatternFly versions follow the vendored pkg/lib, which is built
      # against the exact release Cockpit uses at the pinned commit; the
      # cockpit-lib-update workflow moves both together and
      # test/check-patternfly.js fails the build on any mismatch. A
      # dependabot bump can only ever trip that guard, so no update -
      # minor or major - is wanted here.
      - dependency-name: "@patternfly/*"

      # React majors have to move together with the vendored pkg/lib,
      # which is built against the React that Cockpit uses
      - dependency-name: "*react*"
        update-types: ["version-update:semver-major"]

      # eslint 9 requires flat config, which pkg/lib's shared
      # configuration has not moved to - and the whole plugin family
      # moves its majors to eslint 9 with it. eslint-plugin-promise 7
      # already broke eslint-config-standard 17's peer range once.
      - dependency-name: "eslint*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 3
    labels:
      - "no-test"
    schedule:
      interval: "weekly"
