# The browser integration tests (test/check-application), which need a
# test VM and so cannot run in the ordinary checks workflow.
#
# This is not a settled arrangement. The tests are written for a machine
# with a working libvirt, which is what a developer's box and cockpit's
# own CI both are; a GitHub Actions container is not one, and the first
# run of this workflow got as far as downloading the VM image before
# failing to find a libvirt daemon. The Start libvirt step below is an
# attempt at supplying one. If it turns out that VMs cannot be booted
# here, the honest options are to run these tests through Packit and
# Testing Farm, which provision real machines, or to keep `make check` as
# something run by hand on a host that has libvirt.
#
# Weekly rather than per-push: the run downloads a distribution image and
# boots it, which costs tens of minutes. It can also be started by hand
# from the Actions tab against any branch, which is the way to check a
# risky change before merging it.
name: integration
on:
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/cockpit-project/tasks
      # --privileged because the tests boot a real VM inside this
      # container: qemu needs more than the default container is given.
      options: --user root --privileged --device=/dev/kvm --shm-size=1024m
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          # The Makefile takes the version from `git describe --tags`, and
          # a shallow clone has no tags, so without this every artifact is
          # built as version "1".
          fetch-depth: 0

      - name: Pacify git's permission check
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The test framework connects to qemu:///session and assumes a
      # daemon is already listening — cockpit's own CI provides one. A
      # GitHub Actions container does not, which is what the first run of
      # this workflow discovered. Start one, and say plainly what is
      # available if that cannot be done, so a failure here is diagnosable
      # rather than another guess.
      - name: Start libvirt
        run: |
          set -x
          ls -l /dev/kvm || echo "no /dev/kvm"
          command -v virtqemud virtnetworkd virtstoraged virtlogd || true
          if ! command -v virtqemud >/dev/null; then
              echo "::error::virtqemud is not in the tasks container; these tests cannot run here"
              exit 1
          fi
          virtlogd -d || true
          virtnetworkd -d || true
          virtstoraged -d || true
          virtqemud -d
          for _ in $(seq 30); do
              [ -S /var/run/libvirt/virtqemud-sock ] && break
              sleep 1
          done
          ls -l /var/run/libvirt/ || true
          virsh -c qemu:///session version

      # Fetches the test VM image, installs the built package into it,
      # boots it, and drives a real browser against the page.
      - name: Run integration tests
        run: make check

      - name: Keep the test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-logs
          path: |
            Test*.log
            Test*.png
            Test*.html
          if-no-files-found: ignore
