# Create a GitHub upstream release when a version tag is pushed, and attach
# the source tarball, a zip of the built page for installing by hand, and a
# binary package for each distribution family.
#
# The RPM has to be built on Fedora and the deb on Debian, so they cannot
# share a job: the source job creates the release and attaches the tarball and
# the RPM, and the deb job uploads to that release once it exists.
name: release
on:
  push:
    tags:
      # this is a glob, not a regexp
      - '[0-9]*'
jobs:
  source:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cockpit-project/tasks:latest
      options: --user root
    permissions:
      # create GitHub release
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gh
        run: dnf install -y gh

      # https://github.blog/2022-04-12-git-security-vulnerability-announced/
      - name: Pacify git's permission check
        run: git config --global --add safe.directory /__w/

      - name: Workaround for https://github.com/actions/checkout/pull/697
        run: |
          TAG_VERSION="$(git describe --tags)"
          git fetch --force origin ${TAG_VERSION}:refs/tags/${TAG_VERSION}

      - name: Build release
        run: make dist

      - name: Build zip
        run: make zip

      # The spec exists once `make dist` has run, so its BuildRequires can be
      # resolved from it rather than duplicated here.
      - name: Install RPM build dependencies
        run: |
          dnf install -y rpm-build 'dnf-command(builddep)'
          dnf builddep -y cockpit-samba.spec

      - name: Build RPM
        run: make rpm

      - name: Create a release
        run: |
          set -eux

          TAG_VERSION="$(git describe --tags)"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          ASSETS="${REPO_NAME}-${TAG_VERSION}.tar.xz ${REPO_NAME}-${TAG_VERSION}.zip"
          ASSETS="${ASSETS} $(ls *.noarch.rpm)"

          # The release can already exist: publishing one from the GitHub web
          # interface creates the tag, which is what triggers this workflow,
          # and re-running the job after a failure lands here too. Upload into
          # it rather than failing.
          if gh release view "${TAG_VERSION}" >/dev/null 2>&1; then
              gh release upload "${TAG_VERSION}" ${ASSETS} --clobber
          else
              # The release notes are the body of the annotated tag.
              git tag -l --format='%(contents:body)' "${TAG_VERSION}" > release-note.txt
              gh release create --title "${TAG_VERSION}" --notes-file release-note.txt \
                "${TAG_VERSION}" ${ASSETS}
          fi

  deb:
    needs: source
    runs-on: ubuntu-latest
    permissions:
      # upload to the release the source job created
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debhelper fakeroot gettext

      - name: Workaround for https://github.com/actions/checkout/pull/697
        run: |
          TAG_VERSION="$(git describe --tags)"
          git fetch --force origin ${TAG_VERSION}:refs/tags/${TAG_VERSION}

      - name: Build Debian package
        run: make deb

      - name: Attach it to the release
        run: gh release upload "$(git describe --tags)" *.deb --clobber
