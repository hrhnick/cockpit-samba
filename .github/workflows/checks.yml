# The checks that need nothing but a checkout: types, lint, the smb.conf
# model, that every dialog mounts, and that the page builds. The browser
# integration tests are not here because they need a test VM.
name: checks
on:
  push:
    branches: [main]
  pull_request:
  # so a cockpit-lib-update pull request can be re-checked by hand after
  # its PatternFly versions are corrected
  workflow_dispatch:

# A new push supersedes whatever was running for the same branch.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      # No setup-node step: the runner image already ships a Node newer than
      # package.json asks for. `make` installs node_modules with npm ci from
      # the committed lockfile, fetches pkg/lib from the pinned Cockpit
      # commit, and builds into dist/.
      - name: Build
        run: make

      # Runs after the build, which is what fetches the Cockpit commit this
      # compares against.
      - name: Check PatternFly against pkg/lib
        run: node test/check-patternfly.js

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run eslint

      - name: Stylelint
        run: npm run stylelint

      - name: Unit and dialog tests
        run: npm test

  # The release builds in the Cockpit tasks container, which carries a much
  # newer npm than the runner image above; npm ci is strict about the
  # lockfile and the two versions disagree about what a complete one looks
  # like. A lockfile that installs here can therefore still fail the
  # release - which is exactly what happened to 2.0.6, after the checks
  # above had gone green. This installs in the release's own environment so
  # that failure lands on the pull request instead of on a tag.
  release-env:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/cockpit-project/tasks
      options: --user root
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Pacify git's permission check
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install from the lockfile, as the release does
        run: npm ci

      - name: Report the npm this ran against
        run: npm --version && node --version
