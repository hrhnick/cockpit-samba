# Moves COCKPIT_REPO_COMMIT forward and re-checks out pkg/lib.
#
# IMPORTANT: pkg/lib is written against the PatternFly release Cockpit used
# at that commit, and this does not touch package.json, so its pull request
# can introduce a version mismatch that builds cleanly and renders wrong.
# Its pull request is opened with GITHUB_TOKEN, which by design does not
# start the checks workflow, so nothing catches that automatically: run the
# checks workflow by hand against the branch before merging
# (Actions -> checks -> Run workflow -> pick the branch), or run
# `make check-patternfly` locally.
name: cockpit-lib-update
on:
  schedule:
    - cron: '0 2 * * 4'
  # can be run manually on https://github.com/hrhnick/cockpit-samba/actions
  workflow_dispatch:
jobs:
  cockpit-lib-update:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Set up dependencies
        run: |
          sudo apt update
          sudo apt install -y make

      - name: Set up configuration and secrets
        run: |
          printf '[user]\n\tname = Cockpit Project\n\temail=cockpituous@gmail.com\n' > ~/.gitconfig
          echo '${{ secrets.GITHUB_TOKEN }}' > ~/.config/github-token

      - name: Clone repository
        uses: actions/checkout@v7

      - name: Run cockpit-lib-update
        run: |
          make bots
          bots/cockpit-lib-update
